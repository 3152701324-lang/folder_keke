<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#edf1eb">
<title>FOLD FIELD · 纸上地图</title>
<style>
:root{--ink:#24342c;--muted:#849087;--line:#e2e7df;--green:#385c45;--lime:#dbed8e;--paper:#fbfcf8;--red:#cd6b64}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:linear-gradient(180deg,#f5f7f1 0%,#edf1e9 100%);color:var(--ink);font-family:"Segoe UI","Microsoft YaHei",Arial,sans-serif;font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh}
a{color:inherit;text-decoration:none}
.shell{max-width:1080px;margin:0 auto;padding:0 28px}
.nav{display:flex;align-items:center;justify-content:space-between;padding:22px 0}
.brand{display:flex;align-items:center;gap:12px}
.brandmark{width:38px;height:38px;color:var(--green);display:grid;place-items:center}
.brandmark svg{width:36px;height:36px;stroke-width:1.4}
.brand-name{font-size:17px;font-weight:800;letter-spacing:2px;line-height:1.1}
.brand-sub{margin-top:3px;color:var(--muted);font-size:10px;letter-spacing:1px}
.nav-tag{font-size:10px;color:var(--muted);padding:4px 8px;border:1px solid var(--line);border-radius:20px;letter-spacing:1px}
.hero{padding:56px 0 34px;text-align:center}
.hero .kicker{display:inline-flex;align-items:center;gap:7px;font-size:11px;letter-spacing:2px;color:var(--green);text-transform:uppercase;padding:5px 12px;border:1px solid #cfdcc4;border-radius:20px;background:#fbfcf8}
.hero .kicker i{width:7px;height:7px;border-radius:50%;background:#86ad61}
.hero h1{margin:26px 0 14px;font-size:clamp(34px,6vw,62px);font-weight:800;letter-spacing:1px;line-height:1.06;color:var(--ink)}
.hero h1 em{font-style:normal;color:var(--green)}
.hero .lede{max-width:560px;margin:0 auto;color:#6f7f72;font-size:15px;line-height:1.8}
.cta{display:flex;gap:12px;justify-content:center;margin-top:34px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;height:46px;padding:0 24px;border-radius:7px;font-size:14px;font-weight:600;transition:transform .15s,background .15s,border-color .15s,color .15s;border:1px solid var(--line)}
.btn svg{width:18px;height:18px;stroke-width:1.8}
.btn:hover{transform:translateY(-1px)}
.btn.primary{background:var(--green);color:#fff;border-color:var(--green);box-shadow:0 8px 22px #385c4533}
.btn.primary:hover{background:#426e51}
.btn.ghost{background:#fbfcf8;color:var(--green)}
.btn.ghost:hover{background:#edf1e7}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;padding:18px 0 60px}
.card{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:26px 24px 24px;transition:transform .16s,border-color .16s,box-shadow .16s;display:flex;flex-direction:column;min-height:230px}
.card:hover{transform:translateY(-3px);border-color:#c6d6b9;box-shadow:0 14px 34px #24342c0d}
.card .ico{width:46px;height:46px;border-radius:10px;display:grid;place-items:center;color:#3f6148;background:#eaf1e1;margin-bottom:18px}
.card .ico svg{width:24px;height:24px;stroke-width:1.6}
.card h2{margin:0;font-size:16px;font-weight:700;letter-spacing:.5px}
.card p{margin:10px 0 0;color:#76877a;font-size:13px;line-height:1.7;flex:1}
.card .foot{display:inline-flex;align-items:center;gap:6px;margin-top:20px;font-size:13px;font-weight:600;color:var(--green)}
.card .foot svg{width:16px;height:16px;stroke-width:1.8}
.card.soon{opacity:.68}
.card.soon .foot{color:#9aa79d;font-weight:500}
.badge{position:absolute;top:18px;right:18px;font-size:10px;letter-spacing:1px;color:#8b9b8f;padding:3px 8px;border:1px solid var(--line);border-radius:20px;background:#f4f6ef}
.footnote{text-align:center;color:#98a398;font-size:11px;padding:0 0 50px}
.footnote b{color:#7d8f80;font-weight:600}
@media(max-width:780px){.grid{grid-template-columns:1fr}.hero{padding:38px 0 22px}.hero h1{font-size:36px}.shell{padding:0 20px}}
</style>
</head>
<body>
<div class="shell">
  <header class="nav">
    <div class="brand">
      <div class="brandmark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l9 5-4 13H7L3 8z"/><path d="M12 3 3 8h18"/><path d="M7 21l5-8 5 8"/></svg></div>
      <div>
        <div class="brand-name">FOLD FIELD</div>
        <div class="brand-sub">纸上地图 · 2.5D</div>
      </div>
    </div>
    <span class="nav-tag">LOCAL PLAYGROUND</span>
  </header>

  <section class="hero">
    <span class="kicker"><i></i>FOLD · DRAW · PLAY</span>
    <h1>纸上地图<br><em>折出你的关卡</em></h1>
    <p class="lede">在 2.5D 等距网格上绘制地图、放置折线与出口，利用对称传送破解谜题。一个开箱即用的本地关卡工坊。</p>
    <div class="cta">
      <a class="btn primary" href="library.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4.5v15l13-7.5z"/></svg>开始游戏</a>
      <a class="btn ghost" href="editor.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>打开地图编辑器</a>
    </div>
  </section>

  <section class="grid">
    <a class="card" href="library.html">
      <div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4.5v15l13-7.5z"/></svg></div>
      <h2>开始游戏</h2>
      <p>浏览本地图库，选择关卡开始游玩或继续编辑。</p>
      <span class="foot">浏览图库<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg></span>
    </a>
    <a class="card" href="editor.html">
      <div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></div>
      <h2>地图编辑器</h2>
      <p>绘制方块、放置折线、设置玩家与出口，导出独立游戏。</p>
      <span class="foot">开始创作<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg></span>
    </a>
    <a class="card" href="game.html">
      <div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4.5v15l13-7.5z"/></svg></div>
      <h2>内置演示关卡</h2>
      <p>直接进入内置示例关卡，体验折叠传送与步数挑战。</p>
      <span class="foot">进入演示<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg></span>
    </a>
  </section>

  <p class="footnote">FOLD FIELD · <b>本地静态版</b> · 无需联网即可游玩与编辑</p>
</div>
</body>
</html>
