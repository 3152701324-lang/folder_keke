<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#edf1eb">
<title>本地图库 · FOLD FIELD</title>
<style>
:root{--ink:#24342c;--muted:#849087;--line:#e2e7df;--green:#385c45;--lime:#dbed8e;--paper:#fbfcf8;--red:#cd6b64}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:linear-gradient(180deg,#f5f7f1 0%,#edf1e9 100%);color:var(--ink);font-family:"Segoe UI","Microsoft YaHei",Arial,sans-serif;font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh}
a{color:inherit;text-decoration:none}
.shell{max-width:1080px;margin:0 auto;padding:0 28px}
.site-header{display:flex;align-items:center;justify-content:space-between;padding:22px 0}
.brand{display:flex;align-items:center;gap:12px}
.brand .mark{width:34px;height:34px;display:grid;place-items:center;color:#fff;background:var(--green);border-radius:8px;flex:none}
.brand .mark svg{width:20px;height:20px;stroke-width:1.6}
.brand .text{display:flex;flex-direction:column;line-height:1.2}
.brand .name{font-size:15px;font-weight:800;letter-spacing:2px}
.brand .sub{font-size:10px;color:var(--muted);letter-spacing:1px;margin-top:2px}
.site-nav{display:flex;gap:22px;align-items:center}
.site-nav a{color:var(--muted);font-size:13px;font-weight:600}
.site-nav a:hover{color:var(--green)}
.page{padding:24px 0 64px}
.page-heading{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.page-heading h1{margin:0;font-size:30px;font-weight:800;letter-spacing:1px}
.page-heading .actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 18px;border-radius:7px;font-size:13px;font-weight:600;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer;transition:transform .15s,background .15s,border-color .15s,color .15s,opacity .15s}
.btn:hover{transform:translateY(-1px)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.primary{background:var(--green);color:#fff;border-color:var(--green);box-shadow:0 8px 22px #385c4533}
.btn.primary:hover:not(:disabled){background:#426e51}
.btn.danger{color:var(--red);border-color:#ecd4d1}
.btn.danger:hover:not(:disabled){background:#fbf0ee}
.status-message{font-size:13px;padding:10px 14px;border:1px solid #c9d8bf;border-radius:8px;background:#f3f8ee;color:#446046;margin:18px 0 0}
.status-message.error{border-color:#ecd4d1;background:#fbf0ee;color:#a14d46}
.browser-layout{display:grid;grid-template-columns:1fr 280px;gap:20px;margin-top:22px;align-items:start}
.map-list{background:var(--paper);border:1px solid var(--line);border-radius:12px;overflow:hidden;min-height:360px;max-height:560px;overflow-y:auto}
.map-item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .12s}
.map-item:last-child{border-bottom:0}
.map-item:hover{background:#f2f6ed}
.map-item.selected{background:#eaf1e1;box-shadow:inset 3px 0 0 var(--green)}
.map-item .info{min-width:0}
.map-item .name{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.map-item .meta{font-size:12px;color:var(--muted);margin-top:2px}
.badge{flex:none;font-size:10px;letter-spacing:1px;color:#8b9b8f;padding:3px 8px;border:1px solid var(--line);border-radius:20px;background:#f4f6ef}
.empty-state{color:var(--muted);text-align:center;padding:60px 20px;font-size:13px}
.browser-actions{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:10px;position:sticky;top:20px}
.browser-actions h2{margin:0 0 2px;font-size:12px;font-weight:700;letter-spacing:1px;color:var(--muted);text-transform:uppercase}
.selected-info{font-size:13px;color:var(--ink);white-space:pre-line;min-height:42px;margin-bottom:6px}
@media(max-width:820px){.browser-layout{grid-template-columns:1fr}.map-list{max-height:none}.browser-actions{position:static}}
</style>
</head>
<body>
<div class="shell">
  <header class="site-header">
    <a class="brand" href="index.html">
      <span class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l9 5-4 13H7L3 8z"/><path d="M12 3 3 8h18"/><path d="M7 21l5-8 5 8"/></svg></span>
      <span class="text"><span class="name">FOLD FIELD</span><span class="sub">本地图库 · 纸上地图</span></span>
    </a>
    <nav class="site-nav">
      <a href="index.html">首页</a>
      <a href="editor.html">地图编辑器</a>
    </nav>
  </header>

  <main class="page">
    <div class="page-heading">
      <h1>本地图库</h1>
      <div class="actions">
        <button id="refresh" class="btn">刷新列表</button>
        <button id="import" class="btn">导入地图</button>
        <a class="btn primary" href="editor.html">新建地图</a>
      </div>
    </div>
    <p id="message" class="status-message" hidden></p>

    <div class="browser-layout">
      <div id="map-list" class="map-list"><div class="empty-state">加载中…</div></div>
      <aside class="browser-actions">
        <h2>所选地图</h2>
        <div id="selected-info" class="selected-info">尚未选择地图</div>
        <button id="play" class="btn primary" disabled>开始游戏</button>
        <button id="edit" class="btn" disabled>编辑</button>
        <button id="export" class="btn" disabled>导出地图</button>
        <button id="delete" class="btn danger" disabled>删除</button>
      </aside>
    </div>
  </main>
</div>

<input id="import-file" type="file" accept=".json,application/json" hidden>
<script>window.__FOLD_FIELD_SEED_MAPS__=[{"map_id":"demo","map_name":"回折 · 一线两用","author":"内置示例","version":1,"is_official":true,"published":false,"map":{"version":1,"width":14,"height":10,"tiles":[[null,null,null,null,null,null,null,null,null,null,null,null,null,null],[null,null,null,null,null,null,{"color":"purple","fold":"v"},null,null,null,null,null,null,null],[null,{"color":"blue","fold":null},null,null,null,null,null,null,null,null,null,null,null,null],[null,null,{"color":"blue","fold":null},null,null,null,null,null,{"color":"purple","fold":"d1"},null,null,null,null,null],[null,null,null,{"color":"blue","fold":null},null,null,null,null,null,null,null,{"color":"yellow","fold":null},null,null],[null,null,{"color":"black","fold":null},{"color":"black","fold":null},{"color":"black","fold":null},null,{"color":"purple","fold":"h"},null,null,null,{"color":"black","fold":null},{"color":"black","fold":null},{"color":"black","fold":null},null],[null,null,null,{"color":"red","fold":null},null,null,null,null,{"color":"black","fold":null},{"color":"red","fold":null},null,null,null,null],[{"color":"black","fold":null},{"color":"black","fold":null},{"color":"black","fold":null},{"color":"black","fold":null},{"color":"black","fold":null},null,null,null,null,null,null,null,null,null],[null,{"color":"green","fold":null},null,null,null,null,null,null,null,null,null,null,null,null],[null,null,null,null,null,null,null,null,null,null,null,null,null,null]],"spawn":{"r":8,"c":1,"dir":0},"exit":{"r":4,"c":11},"name":"回折 · 一线两用","description":"同一条折线，换个站位就能通往另一座孤岛。抵达黄色出口，挑战 6 步。","maxSteps":8,"bestSteps":null}}];</script>
<script>
(function () {
  var LIBRARY_KEY = 'fold-field-map-library-v1';
  var SEEDS = window.__FOLD_FIELD_SEED_MAPS__ || [];

  var state = { items: [], selected: null };
  var listEl = document.getElementById('map-list');
  var messageEl = document.getElementById('message');
  var selectedInfoEl = document.getElementById('selected-info');
  var playBtn = document.getElementById('play');
  var editBtn = document.getElementById('edit');
  var exportBtn = document.getElementById('export');
  var deleteBtn = document.getElementById('delete');
  var importBtn = document.getElementById('import');
  var refreshBtn = document.getElementById('refresh');
  var importFile = document.getElementById('import-file');

  function setMessage(text, isError) {
    messageEl.textContent = text || '';
    messageEl.hidden = !text;
    messageEl.className = 'status-message' + (isError ? ' error' : '');
  }

  function readLibrary() {
    try {
      var raw = localStorage.getItem(LIBRARY_KEY);
      if (raw) {
        var parsed = JSON.parse(raw);
        if (Array.isArray(parsed)) return parsed;
      }
    } catch (e) {}
    return null;
  }

  function writeLibrary(items) {
    try {
      localStorage.setItem(LIBRARY_KEY, JSON.stringify(items));
      return true;
    } catch (e) {
      return false;
    }
  }

  function ensureSeeded() {
    if (readLibrary() === null) {
      writeLibrary(SEEDS.map(function (seed) { return JSON.parse(JSON.stringify(seed)); }));
    }
  }

  function loadItems() {
    ensureSeeded();
    return readLibrary() || [];
  }

  function sizeLabel(item) {
    var m = item.map;
    if (m && Number.isInteger(m.width) && Number.isInteger(m.height)) return m.width + ' × ' + m.height;
    return '未知尺寸';
  }

  function updateSelection() {
    var item = state.selected;
    if (!item) {
      selectedInfoEl.textContent = '尚未选择地图';
      playBtn.disabled = true;
      editBtn.disabled = true;
      exportBtn.disabled = true;
      deleteBtn.disabled = true;
      return;
    }
    selectedInfoEl.textContent = (item.map_name || item.map_id) + '\n' + (item.author || '未知') + ' · ' + sizeLabel(item);
    playBtn.disabled = false;
    editBtn.disabled = false;
    exportBtn.disabled = false;
    deleteBtn.disabled = !!item.is_official;
  }

  function selectItem(mapId) {
    state.selected = null;
    for (var i = 0; i < state.items.length; i++) {
      if (state.items[i].map_id === mapId) state.selected = state.items[i];
    }
    listEl.querySelectorAll('.map-item').forEach(function (el) {
      el.classList.toggle('selected', el.getAttribute('data-id') === mapId);
    });
    updateSelection();
  }

  function renderList() {
    state.items = loadItems();
    if (!state.items.length) {
      listEl.innerHTML = '<div class="empty-state">图库为空，先在编辑器保存或导入一张地图吧</div>';
      state.selected = null;
      updateSelection();
      return;
    }
    listEl.innerHTML = '';
    for (var i = 0; i < state.items.length; i++) {
      (function (item) {
        var row = document.createElement('div');
        row.className = 'map-item';
        row.setAttribute('data-id', item.map_id);
        var badges = [];
        if (item.is_official) badges.push('<span class="badge">内置</span>');
        row.innerHTML = '<div class="info"><div class="name"></div><div class="meta"></div></div>' + badges.join('');
        row.querySelector('.name').textContent = item.map_name || item.map_id;
        row.querySelector('.meta').textContent = (item.author || '未知') + ' · ' + sizeLabel(item);
        row.addEventListener('click', function () { selectItem(item.map_id); });
        listEl.appendChild(row);
      })(state.items[i]);
    }
    selectItem(state.items[0].map_id);
  }

  function makeId() {
    return Math.random().toString(16).slice(2, 14);
  }

  function deleteSelected() {
    var item = state.selected;
    if (!item) return;
    if (item.is_official) { setMessage('内置地图不可删除', true); return; }
    if (!window.confirm('确定删除“' + (item.map_name || item.map_id) + '”吗？')) return;
    var items = state.items.filter(function (x) { return x.map_id !== item.map_id; });
    writeLibrary(items);
    state.selected = null;
    setMessage('已删除');
    renderList();
  }

  function exportSelected() {
    var item = state.selected;
    if (!item) return;
    var data = item.map || {};
    var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = (item.map_id || 'map') + '.json';
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 500);
  }

  function importMap() {
    var file = importFile.files && importFile.files[0];
    importFile.value = '';
    if (!file) return;
    if (file.size > 2 * 1024 * 1024) { setMessage('地图文件过大（超过 2 MB）', true); return; }
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var parsed = JSON.parse(reader.result);
        var item;
        if (parsed && typeof parsed === 'object' && parsed.map && typeof parsed.map === 'object') {
          item = {
            map_id: parsed.map_id || makeId(),
            map_name: parsed.map_name || file.name.replace(/\.json$/i, '') || '导入地图',
            author: parsed.author || '本地导入',
            is_official: false,
            published: false,
            map: parsed.map
          };
        } else {
          item = {
            map_id: makeId(),
            map_name: file.name.replace(/\.json$/i, '') || '导入地图',
            author: '本地导入',
            is_official: false,
            published: false,
            map: parsed
          };
        }
        var items = loadItems();
        items.push(item);
        writeLibrary(items);
        setMessage('已导入并保存到本地图库');
        renderList();
        selectItem(item.map_id);
      } catch (e) {
        setMessage('导入失败：' + e.message, true);
      }
    };
    reader.onerror = function () { setMessage('读取文件失败', true); };
    reader.readAsText(file);
  }

  refreshBtn.addEventListener('click', function () { setMessage(''); renderList(); });
  importBtn.addEventListener('click', function () { importFile.click(); });
  importFile.addEventListener('change', importMap);
  exportBtn.addEventListener('click', exportSelected);
  deleteBtn.addEventListener('click', deleteSelected);
  playBtn.addEventListener('click', function () {
    if (state.selected) window.location.href = 'editor.html?map=' + encodeURIComponent(state.selected.map_id) + '&mode=play';
  });
  editBtn.addEventListener('click', function () {
    if (state.selected) window.location.href = 'editor.html?map=' + encodeURIComponent(state.selected.map_id);
  });

  renderList();
})();
</script>
</body>
</html>
